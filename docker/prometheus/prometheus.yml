global:
  scrape_interval: 10s
scrape_configs:
  - job_name: stocksafe-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080", "core:8080"]    # Maven run, or full compose
  - job_name: stocksafe-alerts
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081", "alerts:8081"]
