# Local run, all free.
#   Infra only (run the apps with Maven):  docker compose up -d
#   Everything in containers:              docker compose --profile full up -d --build
# Reset everything: docker compose --profile full down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocksafe
      POSTGRES_USER: stocksafe              # owner: runs Flyway, bypasses RLS
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksafe}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksafe -d stocksafe"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:                                  # traces UI: http://localhost:16686
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

  prometheus:                              # http://localhost:9090
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9090:9090"]

  grafana:                                 # http://localhost:3000  (admin / admin)
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  core:
    profiles: ["full"]
    build: { context: ., dockerfile: stocksafe-core/Dockerfile }
    environment: &appenv
      SPRING_PROFILES_ACTIVE: json
      DB_URL: jdbc:postgresql://postgres:5432/stocksafe
      RABBIT_HOST: rabbitmq
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      JWT_SECRET: change-me-change-me-change-me-32bytes!!
      PLATFORM_ADMIN_KEY: dev-admin-key
      ALERTS_ADMIN_TOKEN: dev-admin-token
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  alerts:
    profiles: ["full"]
    build: { context: ., dockerfile: stocksafe-alerts/Dockerfile }
    environment: *appenv
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      core: { condition: service_started }     # core creates the shared schema first

volumes:
  pgdata:
