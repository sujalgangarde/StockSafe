server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: stocksafe-core
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksafe}
    username: ${DB_APP_USER:stocksafe_app}
    password: ${DB_APP_PASSWORD:stocksafe_app}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksafe}
    user: ${DB_OWNER_USER:stocksafe}
    password: ${DB_OWNER_PASSWORD:stocksafe}
    baseline-on-migrate: true      # the alerts service shares this schema
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false      # failed messages go to the dead-letter queue
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:false}   # set true to send traces to Jaeger (docker compose up -d jaeger)
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: stocksafe-core
    distribution:
      percentiles-histogram:
        http.server.requests: true
        stocksafe.alert.latency: true
        stocksafe.import.duration: true

stocksafe:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32bytes!!}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  relay:
    enabled: true
  ratelimit:
    enabled: true
    store: ${RATELIMIT_STORE:redis}      # redis | memory
  admin:
    key: ${PLATFORM_ADMIN_KEY:}          # empty = platform admin API is disabled
  billing:
    mock: ${BILLING_MOCK:true}           # true = no real Razorpay calls
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_dev}
    razorpay-plan-pro: ${RAZORPAY_PLAN_PRO:}
    trial-days: 14
    grace-days: 7
